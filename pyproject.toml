[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ddmsoft"
version = "0.1.0"
description = "Native desktop tools for differential dynamic microscopy"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{name = "DDMSoft contributors"}]
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "opencv-python",
    "PySide6",
]
classifiers = [
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.optional-dependencies]
dev = [
    "build",
    "pytest",
    "pytest-qt",
    "ruff",
]

[project.scripts]
ddmsoft = "ddmsoft.__main__:main"
ddmsoft-benchmark = "ddmsoft.benchmark:main"
ddmsoft-demo = "ddmsoft.demo:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ddmsoft = ["resources/*"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
