[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ddmsoft"
version = "2.0.0"
description = "Portable differential dynamic microscopy analysis software"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "joblib>=1.3",
    "opencv-python>=4.8",
    "PySide6>=6.8",
]

[project.scripts]
ddmsoft = "DDMSoft:main"

[tool.setuptools]
py-modules = [
    "DDMSoft",
    "ddmsoft_gui",
    "contin",
    "fitDDM",
    "generateDDM",
    "layoutFile",
    "namedConcepts",
    "plotDDM",
    "utilities",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
