name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "17 4 * * 1"

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.14"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install build and test tools
        run: python -m pip install --upgrade pip build pytest pytest-qt ruff
      - name: Build wheel and source distribution
        run: python -m build
      - name: Install built wheel
        run: python -m pip install --force-reinstall dist/ddmsoft-0.1.0-py3-none-any.whl
      - name: Smoke test installed package outside repository
        run: python -c "import os,tempfile; os.chdir(tempfile.mkdtemp()); import ddmsoft; from ddmsoft.resources import icon; assert icon().is_file(); print(ddmsoft.__version__)"
      - name: Run tests
        run: python -m pytest
      - name: Run Ruff
        run: python -m ruff check .
      - name: Run generated benchmark
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14'
        run: ddmsoft-benchmark --output ddmsoft-benchmark.json
